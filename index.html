<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Exploration Quiz</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            font-size: 16px;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #333;
                color: #f0f0f0;
            }
        }
        #quiz-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        #progress-bar {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #progress {
            height: 10px;
            background-color: #76c7c0;
            width: 0;
            transition: width 0.3s;
        }
        .feedback {
            display: none;
            font-size: 20px;
            margin-top: 10px;
        }
        .correct {
            color: green;
            animation: fadeIn 0.5s;
        }
        .wrong {
            color: red;
            animation: shake 0.5s;
        }
        @keyframes shake {
            0% { transform: translate(0); }
            25% { transform: translate(-5px, 0); }
            50% { transform: translate(5px, 0); }
            75% { transform: translate(-5px, 0); }
            100% { transform: translate(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #results {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="quiz-container">
        <h1>Space Exploration Quiz</h1>
        <div id="progress-bar">
            <div id="progress"></div>
        </div>
        <div id="question"></div>
        <div id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button id="next" style="display: none;">Next</button>
        <div id="results">
            <h2>Your Score: <span id="score"></span></h2>
            <div id="emoji"></div>
        </div>
    </div>

    <script>
        const questions = [
            { question: "What planet is known as the Red Planet?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: 1 },
            { question: "What is the largest planet in our solar system?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: 2 },
            { question: "Which planet is known for its rings?", options: ["Earth", "Mars", "Jupiter", "Saturn"], answer: 3 },
            { question: "What is the name of the first human in space?", options: ["Neil Armstrong", "Yuri Gagarin", "Buzz Aldrin", "John Glenn"], answer: 1 },
            { question: "What is the closest star to Earth?", options: ["Proxima Centauri", "Sirius", "Alpha Centauri", "Betelgeuse"], answer: 0 },
            { question: "What spacecraft was the first to land on the Moon?", options: ["Apollo 11", "Voyager 1", "Mars Rover", "Challenger"], answer: 0 },
            { question: "Which planet is known as the Morning Star?", options: ["Venus", "Mars", "Mercury", "Jupiter"], answer: 0 },
            { question: "What is the name of the galaxy that contains our solar system?", options: ["Andromeda", "Milky Way", "Triangulum", "Whirlpool"], answer: 1 },
            { question: "What is the term for a moon that is full of craters?", options: ["Icy", "Rocky", "Gassy", "Terrestrial"], answer: 1 },
            { question: "What is the name of NASA's rover on Mars?", options: ["Curiosity", "Opportunity", "Spirit", "Perseverance"], answer: 3 }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const optionsElement = document.getElementById('options');
            const feedbackElement = document.getElementById('feedback');
            const nextButton = document.getElementById('next');

            if (currentQuestion < questions.length) {
                const q = questions[currentQuestion];
                questionElement.textContent = q.question;
                optionsElement.innerHTML = '';
                q.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.onclick = () => checkAnswer(index);
                    optionsElement.appendChild(button);
                });
                feedbackElement.style.display = 'none';
                nextButton.style.display = 'none';
                updateProgress();
            } else {
                showResults();
            }
        }

        function checkAnswer(selected) {
            const feedbackElement = document.getElementById('feedback');
            const nextButton = document.getElementById('next');
            const correctAnswer = questions[currentQuestion].answer;

            if (selected === correctAnswer) {
                score++;
                feedbackElement.textContent = "Correct!";
                feedbackElement.className = 'feedback correct';
            } else {
                feedbackElement.textContent = "Wrong!";
                feedbackElement.className = 'feedback wrong';
            }
            feedbackElement.style.display = 'block';
            nextButton.style.display = 'block';
            currentQuestion++;
        }

        function updateProgress() {
            const progress = document.getElementById('progress');
            const percentage = ((currentQuestion + 1) / questions.length) * 100;
            progress.style.width = percentage + '%';
        }

        function showResults() {
            document.getElementById('quiz-container').style.display = 'none';
            const resultsElement = document.getElementById('results');
            const scoreElement = document.getElementById('score');
            const emojiElement = document.getElementById('emoji');

            scoreElement.textContent = score + '/' + questions.length;
            if (score === questions.length) {
                emojiElement.textContent = '🎉 Perfect Score! 🎉';
            } else if (score >= questions.length / 2) {
                emojiElement.textContent = '😊 Good Job! 😊';
            } else {
                emojiElement.textContent = '😞 Better Luck Next Time! 😞';
            }
            resultsElement.style.display = 'block';
        }

        document.getElementById('next').onclick = loadQuestion;

        loadQuestion();
    </script>
</body>
</html>
